# Bot de ofertas — execução agendada (sem servidor).
#
# A API `/sites/MLB/search` do Mercado Livre devolve 403 (`forbidden`,
# PolicyAgent) mesmo com token OAuth de usuário válido via refresh_token
# (confirmado em 2026-11-26, run #45915495126). Por isso o padrão de
# `DEAL_STORES` é `shopee,amazon`, evitando 403 desnecessários e rotação
# inútil do refresh token. Para postar ofertas do ML, use o workflow
# semi-automático `.github/workflows/post-ml-deal.yml` (aceita links
# mercadolivre.com.br, /sec/... e meli.la). Quem quiser testar a API do ML
# pode definir a variable `DEAL_STORES=ml,shopee,amazon`.
#
# Segredos necessários no repositório (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ML_AFFILIATE_TAG,
#   ML_CLIENT_ID, ML_CLIENT_SECRET, ML_REFRESH_TOKEN,
#   SHOPEE_API_APP_ID, SHOPEE_API_SECRET,
#   AMAZON_AFFILIATE_TAG (ex.: lin63-20),
#   FIRECRAWL_API_KEY (secret — busca da Amazon, plano C com cache diário em
#   data/amazon-cache.json; sem ela, o bot usa data/amazon-deals.json)
# Brindes grátis (Epic + GamerPower, em PT-BR):
#   FREEBIE_SOURCES, FREEBIE_MAX_PER_RUN (vars),
#   MYMEMORY_EMAIL (secret, opcional — parâmetro `de` na API MyMemory).
# Opcional (com defaults no .env.example): DEAL_KEYWORDS, DEAL_MIN_DISCOUNT_PCT,
# DEAL_MAX_DISCOUNT_PCT, DEAL_MIN_PRICE, DEAL_MIN_RATING, DEAL_MIN_SALES,
# DEAL_MAX_POSTS_PER_RUN, DEAL_STORES, ML_AFFILIATE_LABEL.
#
# O data/posted.json e o data/amazon-cache.json são commitados de volta a cada
# execução real para deduplicar entre runs e economizar créditos do Firecrawl.
# Calendário semanal de temas (src/theme.ts): cada dia busca as keywords
# do tema e a 1ª execução do dia anuncia o tema no canal; sábado jogos grátis
# (com ofertas de reserva), domingo IA grátis (dicas curadas + ofertas de reserva).

name: post-deals

on:
  schedule:
    # 10:07, 13:07, 16:07 e 19:07 em BRT (UTC-3) — 13:07, 16:07, 19:07, 22:07 UTC (fora do horário cheio p/ evitar atraso em pico)
    - cron: "7 13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (não posta, só mostra o que seria postado)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-deals
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bot
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_LABEL: ${{ vars.ML_AFFILIATE_LABEL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SHOPEE_API_APP_ID: ${{ secrets.SHOPEE_API_APP_ID }}
          SHOPEE_API_SECRET: ${{ secrets.SHOPEE_API_SECRET }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FREEBIE_SOURCES: ${{ vars.FREEBIE_SOURCES }}
          FREEBIE_MAX_PER_RUN: ${{ vars.FREEBIE_MAX_PER_RUN }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          DEAL_KEYWORDS: ${{ vars.DEAL_KEYWORDS }}
          DEAL_MIN_DISCOUNT_PCT: ${{ vars.DEAL_MIN_DISCOUNT_PCT }}
          DEAL_MAX_DISCOUNT_PCT: ${{ vars.DEAL_MAX_DISCOUNT_PCT }}
          DEAL_MIN_PRICE: ${{ vars.DEAL_MIN_PRICE }}
          DEAL_MIN_RATING: ${{ vars.DEAL_MIN_RATING }}
          DEAL_MIN_SALES: ${{ vars.DEAL_MIN_SALES }}
          DEAL_MAX_POSTS_PER_RUN: ${{ vars.DEAL_MAX_POSTS_PER_RUN }}
          DEAL_STORES: ${{ vars.DEAL_STORES }}
        run: node src/index.ts $([ "$DRY_RUN" = "true" ] && echo --dry-run)
      - name: Persist posted history and daily cache
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "ofertas-bot"
          git config user.email "ofertas-bot@users.noreply.github.com"
          [ -f data/posted.json ] && git add -f data/posted.json || true
          [ -f data/amazon-cache.json ] && git add -f data/amazon-cache.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted history [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
