# Bot de ofertas — execução agendada (sem servidor).
#
# Por que GitHub Actions e não a VM: a API pública do Mercado Livre bloqueia
# o IP da VM (403 + captcha no site). O runner do GitHub usa outro egress.
# Se um dia o ML passar a bloquear o runner também, o job da Shopee continua
# funcionando (a API da Shopee responde normalmente de qualquer lugar).
#
# Segredos necessários no repositório (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ML_AFFILIATE_TAG,
#   SHOPEE_API_APP_ID, SHOPEE_API_SECRET
# Opcional (com defaults no .env.example): DEAL_KEYWORDS, DEAL_MIN_DISCOUNT_PCT,
# DEAL_MAX_POSTS_PER_RUN, DEAL_STORES, ML_AFFILIATE_LABEL.
#
# O data/posted.json é commitado de volta a cada execução para deduplicar
# entre runs (o runner é efêmero — sem isso, a mesma oferta seria repostada).

name: post-deals

on:
  schedule:
    # 10h, 13h, 16h e 19h em BRT (UTC-3) — 13, 16, 19, 22 UTC
    - cron: "0 13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_LABEL: ${{ vars.ML_AFFILIATE_LABEL }}
          SHOPEE_API_APP_ID: ${{ secrets.SHOPEE_API_APP_ID }}
          SHOPEE_API_SECRET: ${{ secrets.SHOPEE_API_SECRET }}
          DEAL_KEYWORDS: ${{ vars.DEAL_KEYWORDS }}
          DEAL_MIN_DISCOUNT_PCT: ${{ vars.DEAL_MIN_DISCOUNT_PCT }}
          DEAL_MAX_POSTS_PER_RUN: ${{ vars.DEAL_MAX_POSTS_PER_RUN }}
          DEAL_STORES: ${{ vars.DEAL_STORES }}
        run: node src/index.ts
      - name: Persist posted history
        run: |
          git config user.name "ofertas-bot"
          git config user.email "ofertas-bot@users.noreply.github.com"
          git add data/posted.json || true
          git diff --cached --quiet || git commit -m "chore: update posted history [skip ci]"
          git push || true
